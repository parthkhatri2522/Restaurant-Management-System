<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}ServeWise{% endblock %}</title>

    <meta
        name="description"
        content="ServeWise - Restaurant Management System"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    {% block head %}{% endblock %}
</head>

<body>

    <header class="topbar">
        <a href="/" class="brand">
            <span class="brand-icon">S</span>
            <span>Serve<span class="brand-highlight">Wise</span></span>
        </a>

        <div class="topbar-right">
            <span class="system-status">
                <span class="status-dot"></span>
                System Online
            </span>

            <a href="/health" class="status-link">
                Backend Status
            </a>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>
            &copy; <span id="current-year"></span> ServeWise.
            Restaurant Management System.
        </p>
        <p>Designed for smarter restaurant operations.</p>
    </footer>

    <script
        src="{{ url_for('static', filename='js/app.js') }}"
    ></script>

    {% block scripts %}{% endblock %}

</body>
</html>
